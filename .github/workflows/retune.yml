name: Monthly backtest and re-tune

on:
  schedule:
    - cron: "17 12 1 * *"   # 1st of each month
  workflow_dispatch:
    inputs:
      years:
        description: "Years of history to test"
        default: "5"

permissions:
  contents: write

jobs:
  retune:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -e .

      - name: Restore market data cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: backtest-${{ github.run_id }}
          restore-keys: backtest-

      - name: Walk-forward backtest and weight optimization
        env:
          YEARS: ${{ inputs.years || '5' }}
        run: |
          watchlist -v backtest --optimize --years "$YEARS" --max-tickers 2000
          watchlist audit-archive || echo "Archive audit failed (non-fatal)"

      - name: Commit report and tuned weights
        run: |
          git config user.name "watchlist-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in reports config/weights.json; do
            [ -e "$p" ] && git add "$p"
          done
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Monthly backtest $(date -u +%Y-%m-%d)"
            git push
          fi
