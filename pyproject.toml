[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-watchlist-agent"
version = "0.1.0"
description = "Research agent that builds and publishes The (Stock) Watchlist podcast: momentum, technical and social scoring with walk-forward backtesting."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Scott Wickman" }]
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=14",
    "pyyaml>=6",
    "requests>=2.31",
    "yfinance>=0.2.50",
    "anthropic>=1.0",
    "edge-tts>=6.1",
    "kokoro-onnx>=0.4",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
watchlist = "watchlist.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
